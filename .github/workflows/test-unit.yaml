name: test-unit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Pull Git LFS files
        uses: ./.github/actions/lfs-pull

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Includes the PostgreSQL contract tests: testcontainers starts
      # postgres:18-alpine on the runner's Docker.
      - name: Run unit tests
        run: go test -race ./...
