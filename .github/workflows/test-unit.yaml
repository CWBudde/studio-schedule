name: test-unit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Pull Git LFS files
        uses: ./.github/actions/lfs-pull

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup just
        uses: extractions/setup-just@v3

      # The receipt renderer's module as wazero compiled it, in
      # os.UserCacheDir()/studio-schedule (wazero for the commands' renderer,
      # wazero-test for package typstwasm's). Compiling it under -race takes
      # minutes on a runner, past doctor's receipts timeout, so a cold cache
      # is filled without -race first (seconds; the compiled module is the
      # same) and saved at once, also when a test fails later.
      - name: Restore compiled receipt module
        id: wazero
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/studio-schedule
          key: wazero-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/pdf/typstwasm/receipt.wasm', 'go.sum') }}

      - name: Compile receipt module
        if: steps.wazero.outputs.cache-hit != 'true'
        run: |
          go test -count=1 -run '^TestDoctorReceiptModule$' ./cmd/studio-schedule
          go test -count=1 ./internal/pdf/typstwasm

      - name: Save compiled receipt module
        if: steps.wazero.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/studio-schedule
          key: ${{ steps.wazero.outputs.cache-primary-key }}

      # Includes the PostgreSQL contract tests: testcontainers starts
      # postgres:18-alpine on the runner's Docker. -coverpkg=./... counts a
      # package's statements whichever package's tests run them (the stores
      # run the shared contract suite, internal/app drives the services).
      - name: Run unit tests
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...

      # Always reported, also when a test failed: the total and the packages
      # with the most uncovered statements, in the log and the job summary
      # (tools/coverage leaves out test suites, generated code and tools).
      - name: Coverage report
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        run: |
          go run ./tools/coverage -top 0 coverage.out
          go run ./tools/coverage -markdown coverage.out >> "$GITHUB_STEP_SUMMARY"

      # The gate: fails below the floors in the justfile (PLAN.md, Phase 9),
      # naming each miss (the full table is in the report above).
      # Only after green tests; a failed test fails the job already.
      - name: Coverage gate
        run: just coverage -top 1

      - name: Upload coverage
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore
