name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint:
    uses: ./.github/workflows/test-lint.yaml

  test-format:
    uses: ./.github/workflows/test-format.yaml

  test-unit:
    uses: ./.github/workflows/test-unit.yaml

  test-web:
    uses: ./.github/workflows/test-web.yaml

  test-e2e:
    uses: ./.github/workflows/test-e2e.yaml

  test-e2e-server:
    uses: ./.github/workflows/test-e2e-server.yaml

  test-restore:
    uses: ./.github/workflows/test-restore.yaml

  test-typst:
    uses: ./.github/workflows/test-typst.yaml

  test-vuln:
    uses: ./.github/workflows/test-vuln.yaml

  # The edge image, built once every test passed on main (image.yaml).
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test-lint
      - test-format
      - test-unit
      - test-web
      - test-e2e
      - test-e2e-server
      - test-restore
      - test-typst
      - test-vuln
    permissions:
      contents: read
      actions: read
      packages: write
      security-events: write
    uses: ./.github/workflows/image.yaml
