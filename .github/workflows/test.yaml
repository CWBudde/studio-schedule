name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint:
    uses: ./.github/workflows/test-lint.yaml

  test-format:
    uses: ./.github/workflows/test-format.yaml

  test-unit:
    uses: ./.github/workflows/test-unit.yaml

  test-web:
    uses: ./.github/workflows/test-web.yaml

  test-e2e:
    uses: ./.github/workflows/test-e2e.yaml
