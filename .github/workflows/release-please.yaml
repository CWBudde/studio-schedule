name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Prefers the fine-grained PAT in RELEASE_PLEASE_TOKEN (docs/operations.md,
      # "Releases"). With the default GITHUB_TOKEN, releases trigger no other
      # workflows (image.yaml, pages.yaml on "release: published") and release
      # PRs run no CI.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
