name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Uses the default GITHUB_TOKEN. Releases created this way do not trigger
      # other workflows (e.g. pages.yaml on "release: published") and release
      # PRs do not run CI. Switch to a fine-grained PAT or GitHub App token
      # (secret RELEASE_PLEASE_TOKEN) once that matters.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
