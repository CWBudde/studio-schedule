name: image

# Builds the container image for linux/amd64 and linux/arm64 and pushes it to
# ghcr.io: `edge` from main, `vX.Y.Z`, `X.Y` and `latest` from a published
# release. Trivy then scans the pushed image, each platform on its own, and
# fails the run on fixable CRITICAL/HIGH findings (the image is already
# pushed by then: the red run is the signal to rebuild, not a publish gate).
#
# `edge` is built only once every test passed: the tests workflow (test.yaml)
# calls this one for a push to main after its jobs succeeded. A push that
# changes nothing but docs/ and Markdown files builds no image. Releases only
# trigger this workflow when release-please runs with a token other than
# GITHUB_TOKEN (RELEASE_PLEASE_TOKEN, see docs/operations.md).

on:
  workflow_call:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Whether a push changed more than docs/ and Markdown files since the last
  # successful tests run on main, whose state edge holds (with a cancelled run
  # in between, `github.event.before` would miss its changes). A release or a
  # manual run always builds.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compare with the last successful run
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          build=true
          if [ "$EVENT" = push ]; then
            base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yaml --branch main \
              --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
            # No earlier run, or its commit is gone (a force push): build.
            if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null &&
              ! git diff --name-only "$base" "$GITHUB_SHA" | grep -qvE '^docs/|\.md$'; then
              build=false
              echo "Only docs/ and Markdown files changed since $base: no image." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  image:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    # Its own group: the caller's (test.yaml's) holds the calling run.
    concurrency:
      group: image-${{ github.ref }}
      # A newer push to main supersedes an edge build; a release build always
      # ends.
      cancel-in-progress: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # git describe needs the tags for the version in the binary.
          fetch-depth: 0

      # receipt.wasm (the receipt renderer) is a Git LFS file; the Dockerfile
      # refuses an LFS pointer.
      - name: Pull Git LFS files
        uses: ./.github/actions/lfs-pull

      - name: Image name and version
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.vars.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Blocking on fixable CRITICAL/HIGH findings (ignore-unfixed): the run
      # goes red so a vulnerable base image cannot ship silently. Trivy scans
      # one platform of a multi-platform image, so each platform gets its own
      # scan and category. The arm64 scan and the SARIF uploads below still
      # run when the amd64 scan fails. limit-severities-for-sarif keeps the
      # severity filter: without it the action drops it for SARIF output, and
      # any fixable finding, LOW included, would fail the run.
      - name: Scan the linux/amd64 image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-amd64.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan the linux/arm64 image with Trivy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-arm64.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload the linux/amd64 results to code scanning
        if: ${{ !cancelled() && hashFiles('trivy-amd64.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-amd64.sarif
          category: trivy-image-amd64

      - name: Upload the linux/arm64 results to code scanning
        if: ${{ !cancelled() && hashFiles('trivy-arm64.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-arm64.sarif
          category: trivy-image-arm64
