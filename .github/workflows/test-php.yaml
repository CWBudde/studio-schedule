name: test-php

on:
  workflow_call:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Check PHP on PostgreSQL, MySQL and MariaDB
        run: ./scripts/php-test.sh
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the production web UI
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build
      - name: Build and check the PHP release ZIP
        run: |
          ./scripts/build-php-release.sh "$RUNNER_TEMP/studio-schedule-php.zip"
          ./scripts/check-php-release.sh "$RUNNER_TEMP/studio-schedule-php.zip"
      - name: Store the verified PHP release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: studio-schedule-php
          path: ${{ runner.temp }}/studio-schedule-php.zip
          if-no-files-found: error
          compression-level: 0
