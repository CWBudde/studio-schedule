name: test-conformance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: conformance
          POSTGRES_DB: studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONFORMANCE_DATABASE_URL: postgres://studio:conformance@127.0.0.1:5432/studio?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Pull Git LFS files
        uses: ./.github/actions/lfs-pull
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run conformance tests at the root and under a prefix
        run: ./scripts/conformance-go.sh

  php-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Pull Git LFS files
        uses: ./.github/actions/lfs-pull
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check PHP test controls and seeded reads on all three databases
        run: ./scripts/conformance-php.sh all --controls-only
      - name: Check the implemented PHP API against OpenAPI on all three databases
        run: >-
          ./scripts/conformance-php.sh all --scenario
          public_settings_and_catalog public_event_details office_event_reads office_event_lifecycle event_registration_reads event_signup
          events_and_registrations event_session_signup_guards
          schedule_release_and_visibility
          registration_and_session password_recovery credential_changes login_rate_limit admin_impersonation account_lifecycle
          catalog_administration term_administration class_lists_and_roster class_creation_and_deletion one_off_lesson_creation lesson_cancellation_and_deletion lesson_editing_and_restoration
          family_profiles person_detail participant_roster_and_history waitlist_invite_lookup_limits calendar_subscription family_and_privacy
          announcements import_inspection member_import duplicate_detection mail_log statistics settings_and_branding push_subscriptions
          pass_type_administration pass_lists receipt_pdf_downloads receipt_lists_and_search receipt_settings_and_logo
