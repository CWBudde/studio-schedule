name: Pull Git LFS files
description: >
  Fetches the Git LFS files of the checkout (the typst receipt renderer,
  internal/pdf/typstwasm/receipt.wasm) through the Actions cache, so CI runs
  do not use up the LFS bandwidth. Run it after actions/checkout.

runs:
  using: composite
  steps:
    # The key is the hash of the LFS objects' IDs: new objects, new cache.
    - name: List LFS objects
      id: objects
      shell: bash
      run: echo "key=lfs-$(git lfs ls-files --long | cut -d ' ' -f1 | sort | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Cache LFS objects
      uses: actions/cache@v4
      with:
        path: .git/lfs
        key: ${{ steps.objects.outputs.key }}

    - name: Pull LFS files
      shell: bash
      run: git lfs pull
