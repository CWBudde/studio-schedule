pid /tmp/studio-nginx.pid;
error_log stderr crit;

events {
    worker_connections 512;
}

http {
    # The application's request log redacts setup and invitation tokens.
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/nginx-client;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    proxy_temp_path /tmp/nginx-proxy;
    scgi_temp_path /tmp/nginx-scgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;

    server {
        listen 8080;
        client_max_body_size 16m;
        root /opt/studio-schedule/public;

        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /opt/studio-schedule/public/index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass unix:/tmp/studio-fpm.sock;
        }
    }
}
