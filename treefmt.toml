# treefmt configuration for studio-schedule.
# The web/ app is formatted by its own prettier setup (pnpm -C web format).

[global]
excludes = [
    "**/.gitignore",
    "**/.git/**",
    "go.mod",
    "go.sum",
    "LICENSE",
    "CHANGELOG.md",
    "**/*.txt",
    "**/*.png",
    "**/*.jpg",
    "**/*.svg",
    "**/*.ico",
    "**/*.wasm",
    "bin/**",
    "build/**",
    "web/**",
    "internal/webui/dist/**",
    # Generated from the Go code (just gen-api), never edited by hand.
    "api/openapi.json",
    ".release-please-manifest.json",
]

# gofumpt + gci as configured in .golangci.yml. Using the linter's own
# formatter keeps `just fmt` and `just lint` from disagreeing (a standalone gci
# binary carries its own stdlib list and misgroups newer packages like uuid).
[formatter.golangci-lint]
command = "golangci-lint"
options = ["fmt"]
includes = ["*.go"]

[formatter.shellcheck]
command = "shellcheck"
includes = ["*.sh"]

[formatter.shfmt]
command = "shfmt"
options = ["-s", "-w"]
includes = ["*.sh"]
priority = 1

[formatter.prettier]
command = "prettier"
options = ["-w"]
includes = ["*.md", "*.yaml", "*.yml", "*.json"]
