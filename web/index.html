<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Studio Schedule – class schedule and booking for dance and ballet schools."
    />
    <meta name="theme-color" content="#9f1d5a" />
    <title>Studio Schedule</title>
    <script>
      // Follow the OS colour scheme before first paint to avoid a flash.
      (function () {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var apply = function () {
          document.documentElement.classList.toggle('dark', mq.matches);
        };
        apply();
        mq.addEventListener('change', apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
